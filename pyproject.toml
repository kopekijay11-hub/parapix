[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parapix"
version = "0.3.0"
description = "Is this strategy's edge real, or is it noise?"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3,<3",
    "scipy>=1.18.1,<2",
    "pandas>=3.0.5,<4",
]
keywords = ["deflated sharpe", "multiple testing", "backtesting", "strategy validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10",
]

[project.urls]
Source = "https://github.com/kopekijay11-hub/parapix"
Issues = "https://github.com/kopekijay11-hub/parapix/issues"
Changelog = "https://github.com/kopekijay11-hub/parapix/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parapix = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
